name: Publish VS Code Marketplace

on:
  push:
    tags:
      - 'vscode-V*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to recover
        required: true
        type: string
      artifact_run_id:
        description: Original tag workflow run whose build succeeded
        required: true
        default: '43055872917'
        type: string
      publish:
        description: Publish after validation (leave disabled for an integrity-only recovery)
        required: true
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.repository == 'mio-kobo/mio-vscode' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vscode-V')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate recovery inputs and release guards
        env:
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          python3 -B .github/scripts/test_plugin_release.py -v
          python3 -B .github/scripts/test_release_artifact.py -v
          python3 -B .github/scripts/test_marketplace_version.py -v
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$RELEASE_TAG" =~ ^vscode-V[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          fi
      - name: Check out original tag source for recovery validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: .release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tag commit in trusted main history
        run: |
          guard="$GITHUB_WORKSPACE/.github/scripts/check-release-history.sh"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then cd .release-source; fi
          bash "$guard"
      - name: Validate original source version
        id: version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then cd .release-source; fi
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$PUBLISH_REQUESTED" = true ]; then
            python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG" --unpublished
          else
            python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG"
          fi
      - name: Install maintained locked publishing tool
        run: npm ci
      - name: Verify publishing dependency and OIDC implementation
        run: |
          npm ls @vscode/vsce
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('node_modules/@vscode/vsce/package.json', 'utf8'));
          const source = fs.readFileSync('node_modules/@vscode/vsce/out/oidc.js', 'utf8');
          if (pkg.version !== '4.1.0' || !source.includes('/_apis/gallery/token?api-version=7.2-preview.1') || !source.includes('Authorization: `FederatedToken ${oidcToken}`')) {
            throw new Error('Unexpected publishing tool or OIDC protocol');
          }
          JS
      - name: Compile and lint maintained source
        run: npm run compile && npm run lint
      - uses: actions/setup-go@v5
        if: github.event_name == 'push'
        with:
          go-version: '1.25.9'
          cache: false
      - name: Real MioCore LSP and extension tests (no pending tests)
        if: github.event_name == 'push'
        env:
          MIO_RELEASE_TESTS: '1'
        run: xvfb-run -a npm test
      - name: Package and validate tested tag source
        if: github.event_name == 'push'
        run: |
          npm run package
          npm run check
          mkdir release
          mapfile -t archives < <(find . -maxdepth 1 -name '*.vsix' -type f)
          test "${#archives[@]}" -eq 1
          cp "${archives[0]}" release/plugin.vsix
          python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG" --archive release/plugin.vsix --checksum
      - name: Verify provenance of the original successful build
        if: github.event_name == 'workflow_dispatch'
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          mkdir provenance
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > provenance/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" > provenance/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" > provenance/artifacts.json
          tag_sha=$(git -C .release-source rev-parse HEAD)
          python3 .github/scripts/verify-release-artifact.py --tag "$RELEASE_TAG" --sha "$tag_sha" --run-id "$SOURCE_RUN_ID" --metadata provenance
      - name: Download original verified VSIX without rebuilding
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: vscode-${{ steps.version.outputs.version }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Verify original checksum and source/archive identity
        if: github.event_name == 'workflow_dispatch'
        run: |
          (cd release && sha256sum --check plugin.vsix.sha256)
          cd .release-source
          python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG" --archive "$GITHUB_WORKSPACE/release/plugin.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: vars.MARKETPLACE_ENABLED == 'true' && (github.event_name == 'push' || inputs.publish == true)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: marketplace-vscode
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: marketplace-vscode-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out tag source while retaining maintained publishing tools
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: .release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck trusted tag history after approval
        run: |
          cd .release-source
          bash "$GITHUB_WORKSPACE/.github/scripts/check-release-history.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install maintained locked publishing tool only (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vscode-${{ needs.build.outputs.version }}
          path: release
      - name: Recheck checksum, manifest and duplicate release
        run: |
          (cd release && sha256sum --check plugin.vsix.sha256)
          cd .release-source
          python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG" --archive "$GITHUB_WORKSPACE/release/plugin.vsix" --unpublished
      - name: Reject duplicate version even while Marketplace search metadata is stale
        run: python3 .github/scripts/check-marketplace-version.py --version "${{ needs.build.outputs.version }}" --unpublished
      - name: Publish exact verified VSIX with OIDC (no PAT fallback)
        run: npx --no-install vsce publish --oidc --packagePath "$GITHUB_WORKSPACE/release/plugin.vsix"
